<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produto | Max Colchões</title><link rel="stylesheet" href="../css/style.css"></head><body class="admin-body"><div class="admin-shell"><aside class="sidebar"><a class="brand light" href="../index.html"><span class="brand-mark">MC</span><span><b>MAX COLCHÕES</b><small>PAINEL DO DONO</small></span></a><a class="side-link" href="dashboard.html">▦ Dashboard</a><a class="side-link" href="produtos.html">□ Produtos</a><a class="side-link" href="estoque.html">◈ Estoque</a><a class="side-link" href="vendas.html">↗ Vendas</a><a class="side-link" href="financeiro.html">◉ Financeiro</a><a class="side-link" href="clientes.html">♙ Clientes</a><a class="side-link" href="configuracoes.html">⚙ Configurações</a><a class="side-link" href="../index.html">← Ver loja</a></aside><main class="admin-main"><div class="admin-top"><div><h1 id="title">Novo produto</h1><p class="muted">Preencha os dados e salve. O produto aparece na vitrine.</p></div></div><div class="admin-card"><form id="productForm" class="form-grid"><div class="field full"><label>Nome do produto</label><input id="name" required></div><div class="field"><label>Categoria</label><select id="category"><option>Colchões</option><option>Camas Box</option><option>Bases</option><option>Cabeceiras</option><option>Travesseiros</option><option>Acessórios</option></select></div><div class="field"><label>Medida</label><select id="measure"><option>Solteiro</option><option>Casal</option><option>Queen</option><option>King</option><option>Único</option></select></div><div class="field"><label>Tipo</label><input id="type" placeholder="Molas, espuma, box..."></div><div class="field"><label>Preço normal</label><input id="price" type="number" step="0.01" required></div><div class="field"><label>Preço promocional (opcional)</label><input id="promo" type="number" step="0.01" value="0"></div><div class="field"><label>Estoque atual</label><input id="stock" type="number" min="0" required></div><div class="field"><label>Estoque mínimo</label><input id="minStock" type="number" min="0" value="2"></div><div class="field full"><label>Descrição</label><textarea id="description"></textarea></div><div class="field full"><label>Caminho da imagem</label><input id="image" value="assets/hero-cama.jpg" placeholder="Ex.: assets/produtos/colchao.jpg"><small class="muted">Para GitHub, coloque a foto na pasta assets e informe o caminho.</small></div><div class="field"><label><input id="featured" type="checkbox"> Produto em destaque</label></div><div class="field"><label><input id="offer" type="checkbox"> Produto em oferta</label></div><div class="field full"><button class="admin-btn green">Salvar produto</button> <a class="admin-btn primary" href="produtos.html">Cancelar</a></div></form></div></main></div><script src="../js/storage.js"></script><script>if(!sessionStorage.getItem("mc_admin"))location.href="index.html";const id=new URLSearchParams(location.search).get("id"),d=getDB(),p=id?d.products.find(x=>x.id===id):null;if(p){title.textContent="Editar produto";for(const k of ["name","category","measure","type","price","promo","stock","minStock","description","image"])if(document.getElementById(k))document.getElementById(k).value=p[k]??"";featured.checked=!!p.featured;offer.checked=!!p.offer}document.querySelector("#productForm").addEventListener("submit",e=>{e.preventDefault();const d=getDB(),obj={id:p?.id||uid("mc"),name:name.value,category:category.value,measure:measure.value,type:type.value,price:Number(price.value),promo:Number(promo.value||0),stock:Number(stock.value),minStock:Number(minStock.value),description:description.value,image:image.value||"assets/hero-cama.jpg",featured:featured.checked,offer:offer.checked,active:true};if(p){const i=d.products.findIndex(x=>x.id===p.id);d.products[i]=obj}else d.products.unshift(obj);saveDB(d);location.href="produtos.html"})</script></body></html>
