<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acesso do dono | Max Colchões</title><link rel="stylesheet" href="../css/style.css"></head><body class="login-wrap"><div class="login-card"><a class="brand" href="../index.html"><span class="brand-mark">MC</span><span><b>MAX COLCHÕES</b><small>ÁREA ADMINISTRATIVA</small></span></a><h1>Acesso do proprietário</h1><div class="notice">Modo GitHub estático: os dados ficam salvos no navegador. Para uso real multiusuário, conecte um backend.</div><form id="loginForm"><div class="field"><label>E-mail</label><input id="email" type="email" value="admin@maxcolchoes.com" required></div><div class="field" style="margin-top:12px"><label>Senha</label><input id="password" type="password" value="123456" required></div><button class="btn btn-dark" style="width:100%;margin-top:18px">Entrar</button><p id="error" class="error"></p></form><p style="font-size:11px;color:#788596;margin-top:20px">Demonstração: admin@maxcolchoes.com / 123456</p></div><script src="../js/storage.js"></script><script>document.querySelector("#loginForm").addEventListener("submit",e=>{e.preventDefault();const d=getDB();if(email.value===d.user.email&&password.value===d.user.password){sessionStorage.setItem("mc_admin","1");location.href="dashboard.html"}else error.textContent="E-mail ou senha inválidos."})</script></body></html>
